name: docs-quality

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run documentation quality checks
        run: bash scripts/qa/run_docs_qa.sh
